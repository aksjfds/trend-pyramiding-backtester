name: Strategy Backtest

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  real-market-backtest:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'Update HYPE and XAU historical data'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Fetch HYPE real 1H history
        run: |
          mkdir -p artifacts/HYPE
          python scripts/fetch_hyperliquid_candles.py \
            --coin HYPE \
            --interval 1h \
            --start 2026-05-01T00:00:00Z \
            --output artifacts/HYPE/HYPE_1h.csv \
            --metadata artifacts/HYPE/market_metadata.json

      - name: Fetch XAU real 1H history
        run: |
          mkdir -p artifacts/XAU
          python scripts/fetch_hyperliquid_candles.py \
            --coin xyz:GOLD \
            --interval 1h \
            --start 2026-04-15T00:00:00Z \
            --end 2026-08-02T00:00:00Z \
            --output artifacts/XAU/XAU_1h.csv \
            --metadata artifacts/XAU/market_metadata.json

      - name: Commit real market history snapshots
        if: github.event_name == 'push' && github.event.head_commit.message == 'Store HYPE and XAU historical data'
        run: |
          mkdir -p data/markets
          cp artifacts/HYPE/HYPE_1h.csv data/markets/HYPE_1h.csv
          cp artifacts/HYPE/market_metadata.json data/markets/HYPE_metadata.json
          cp artifacts/XAU/XAU_1h.csv data/markets/XAU_1h.csv
          cp artifacts/XAU/market_metadata.json data/markets/XAU_metadata.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/markets
          if ! git diff --cached --quiet; then
            git commit -m "Update HYPE and XAU historical data"
            git push origin HEAD:main
          fi

      - name: Backtest HYPE
        run: |
          pyramid-backtest backtest \
            --csv artifacts/HYPE/HYPE_1h.csv \
            --config config/default.toml \
            --output-dir artifacts/HYPE

      - name: Backtest XAU
        run: |
          pyramid-backtest backtest \
            --csv artifacts/XAU/XAU_1h.csv \
            --config config/default.toml \
            --output-dir artifacts/XAU

      - name: Build combined release notes
        run: |
          python scripts/build_multi_market_release.py \
            --root artifacts \
            --output artifacts/release_notes.md

      - name: Package release files
        run: |
          for MARKET in HYPE XAU; do
            cp "artifacts/${MARKET}/summary.json" "artifacts/${MARKET}_summary.json"
            cp "artifacts/${MARKET}/benchmark_summary.json" "artifacts/${MARKET}_benchmark_summary.json"
            cp "artifacts/${MARKET}/comparison.json" "artifacts/${MARKET}_comparison.json"
            cp "artifacts/${MARKET}/equity_curve.csv" "artifacts/${MARKET}_equity_curve.csv"
            cp "artifacts/${MARKET}/benchmark_equity_curve.csv" "artifacts/${MARKET}_benchmark_equity_curve.csv"
            cp "artifacts/${MARKET}/trades.csv" "artifacts/${MARKET}_trades.csv"
            cp "artifacts/${MARKET}/events.csv" "artifacts/${MARKET}_events.csv"
            cp "artifacts/${MARKET}/market_metadata.json" "artifacts/${MARKET}_market_metadata.json"
            cp "artifacts/${MARKET}/${MARKET}_1h.csv" "artifacts/${MARKET}_1h.csv"
          done

      - name: Publish real-market release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          TAG="backtest-v0.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"

          git tag "${TAG}" "${GITHUB_SHA}"
          git push origin "refs/tags/${TAG}"

          gh release create "${TAG}" \
            artifacts/HYPE_summary.json \
            artifacts/HYPE_benchmark_summary.json \
            artifacts/HYPE_comparison.json \
            artifacts/HYPE_equity_curve.csv \
            artifacts/HYPE_benchmark_equity_curve.csv \
            artifacts/HYPE_trades.csv \
            artifacts/HYPE_events.csv \
            artifacts/HYPE_market_metadata.json \
            artifacts/HYPE_1h.csv \
            artifacts/XAU_summary.json \
            artifacts/XAU_benchmark_summary.json \
            artifacts/XAU_comparison.json \
            artifacts/XAU_equity_curve.csv \
            artifacts/XAU_benchmark_equity_curve.csv \
            artifacts/XAU_trades.csv \
            artifacts/XAU_events.csv \
            artifacts/XAU_market_metadata.json \
            artifacts/XAU_1h.csv \
            --verify-tag \
            --title "HYPE + XAU Real-Market Backtest #${GITHUB_RUN_NUMBER} · ${SHORT_SHA}" \
            --notes-file artifacts/release_notes.md \
            --latest

      - name: Upload backtest artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-market-backtest-${{ github.sha }}
          path: artifacts/
          retention-days: 30
