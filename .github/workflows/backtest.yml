name: Strategy Backtest

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: pytest

      - name: Select backtest mode
        id: mode
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "${COMMIT_MESSAGE}" == "v1.1" ]]; then
            echo "mode=regression" >> "${GITHUB_OUTPUT}"
            echo "v11=true" >> "${GITHUB_OUTPUT}"
            echo "release_title=Strategy v1.1 Validation" >> "${GITHUB_OUTPUT}"
            echo "market_csv=data/regression_1h.csv" >> "${GITHUB_OUTPUT}"
          elif [[ "${COMMIT_MESSAGE}" == "Run XAU 1H backtest 2026-04-15 through 2026-08-01" ]]; then
            echo "mode=xau" >> "${GITHUB_OUTPUT}"
            echo "v11=false" >> "${GITHUB_OUTPUT}"
            echo "release_title=XAU 1H Backtest" >> "${GITHUB_OUTPUT}"
            echo "market_csv=artifacts/XAU_1h.csv" >> "${GITHUB_OUTPUT}"
          elif [[ "${COMMIT_MESSAGE}" == "Run HYPE 1H backtest from 2026-05-01" ]]; then
            echo "mode=hype" >> "${GITHUB_OUTPUT}"
            echo "v11=false" >> "${GITHUB_OUTPUT}"
            echo "release_title=HYPE 1H Backtest" >> "${GITHUB_OUTPUT}"
            echo "market_csv=artifacts/HYPE_1h.csv" >> "${GITHUB_OUTPUT}"
          else
            echo "mode=regression" >> "${GITHUB_OUTPUT}"
            echo "v11=false" >> "${GITHUB_OUTPUT}"
            echo "release_title=Regression Backtest" >> "${GITHUB_OUTPUT}"
            echo "market_csv=data/regression_1h.csv" >> "${GITHUB_OUTPUT}"
          fi

      - name: Fetch XAU 1H market data
        if: steps.mode.outputs.mode == 'xau'
        run: |
          python scripts/fetch_hyperliquid_candles.py \
            --coin xyz:GOLD \
            --interval 1h \
            --start 2026-04-15T00:00:00Z \
            --end 2026-08-02T00:00:00Z \
            --output artifacts/XAU_1h.csv \
            --metadata artifacts/market_metadata.json

      - name: Fetch HYPE 1H market data
        if: steps.mode.outputs.mode == 'hype'
        run: |
          python scripts/fetch_hyperliquid_candles.py \
            --coin HYPE \
            --interval 1h \
            --start 2026-05-01T00:00:00Z \
            --output artifacts/HYPE_1h.csv \
            --metadata artifacts/market_metadata.json

      - name: Generate deterministic regression market
        if: steps.mode.outputs.mode == 'regression'
        run: python scripts/generate_fixture.py --output data/regression_1h.csv

      - name: Backtest live market
        if: steps.mode.outputs.mode != 'regression'
        run: |
          pyramid-backtest backtest \
            --csv "${{ steps.mode.outputs.market_csv }}" \
            --config config/default.toml \
            --output-dir artifacts

      - name: Backtest regression market
        if: steps.mode.outputs.mode == 'regression'
        run: |
          pyramid-backtest backtest \
            --csv data/regression_1h.csv \
            --config config/default.toml \
            --signal-column signal_long \
            --output-dir artifacts

      - name: Performance regression gate
        if: steps.mode.outputs.mode == 'regression'
        run: |
          python scripts/check_backtest.py \
            --summary artifacts/summary.json \
            --baseline benchmarks/baseline.json

      - name: Fetch v1.1 validation markets
        if: steps.mode.outputs.v11 == 'true'
        run: |
          python scripts/fetch_hyperliquid_candles.py \
            --coin HYPE \
            --interval 1h \
            --start 2026-05-01T00:00:00Z \
            --output artifacts/HYPE_1h.csv \
            --metadata artifacts/HYPE_market_metadata.json

          python scripts/fetch_hyperliquid_candles.py \
            --coin xyz:GOLD \
            --interval 1h \
            --start 2026-04-15T00:00:00Z \
            --end 2026-08-02T00:00:00Z \
            --output artifacts/XAU_1h.csv \
            --metadata artifacts/XAU_market_metadata.json

      - name: Backtest v1.1 HYPE
        if: steps.mode.outputs.v11 == 'true'
        run: |
          pyramid-backtest backtest \
            --csv artifacts/HYPE_1h.csv \
            --config config/default.toml \
            --output-dir artifacts/v11/HYPE

          pyramid-backtest walk-forward \
            --csv artifacts/HYPE_1h.csv \
            --config config/default.toml \
            --folds 4 \
            --warmup-bars 720 \
            --output-dir artifacts/v11/HYPE

      - name: Backtest v1.1 XAU
        if: steps.mode.outputs.v11 == 'true'
        run: |
          pyramid-backtest backtest \
            --csv artifacts/XAU_1h.csv \
            --config config/default.toml \
            --output-dir artifacts/v11/XAU

          pyramid-backtest walk-forward \
            --csv artifacts/XAU_1h.csv \
            --config config/default.toml \
            --folds 4 \
            --warmup-bars 720 \
            --output-dir artifacts/v11/XAU

      - name: Render trade-history charts
        run: |
          python scripts/plot_backtest.py \
            --csv "${{ steps.mode.outputs.market_csv }}" \
            --events artifacts/events.csv \
            --trades artifacts/trades.csv \
            --output-dir artifacts/charts \
            --days-per-chart 180

      - name: Render v1.1 validation charts
        if: steps.mode.outputs.v11 == 'true'
        run: |
          python scripts/plot_backtest.py \
            --csv artifacts/HYPE_1h.csv \
            --events artifacts/v11/HYPE/events.csv \
            --trades artifacts/v11/HYPE/trades.csv \
            --output-dir artifacts/v11/HYPE/charts \
            --days-per-chart 180

          python scripts/plot_backtest.py \
            --csv artifacts/XAU_1h.csv \
            --events artifacts/v11/XAU/events.csv \
            --trades artifacts/v11/XAU/trades.csv \
            --output-dir artifacts/v11/XAU/charts \
            --days-per-chart 180

      - name: Build v1.1 validation report
        if: steps.mode.outputs.v11 == 'true'
        run: |
          python scripts/build_v11_report.py \
            --root artifacts/v11 \
            --output-json artifacts/v11_validation.json \
            --output-md artifacts/v11_validation.md

          cp artifacts/v11/HYPE/summary.json artifacts/HYPE_summary.json
          cp artifacts/v11/HYPE/walk_forward.json artifacts/HYPE_walk_forward.json
          cp artifacts/v11/HYPE/walk_forward_folds.csv artifacts/HYPE_walk_forward_folds.csv
          cp artifacts/v11/XAU/summary.json artifacts/XAU_summary.json
          cp artifacts/v11/XAU/walk_forward.json artifacts/XAU_walk_forward.json
          cp artifacts/v11/XAU/walk_forward_folds.csv artifacts/XAU_walk_forward_folds.csv

          for file in artifacts/v11/HYPE/charts/*.png; do
            cp "$file" "artifacts/HYPE_$(basename "$file")"
          done
          for file in artifacts/v11/XAU/charts/*.png; do
            cp "$file" "artifacts/XAU_$(basename "$file")"
          done

      - name: Build release notes
        env:
          V11: ${{ steps.mode.outputs.v11 }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary = json.loads(Path("artifacts/summary.json").read_text(encoding="utf-8"))
          metadata_path = Path("artifacts/market_metadata.json")
          metadata = (
              json.loads(metadata_path.read_text(encoding="utf-8"))
              if metadata_path.exists()
              else None
          )
          sha = os.environ["GITHUB_SHA"][:7]
          run_number = os.environ["GITHUB_RUN_NUMBER"]
          run_attempt = os.environ["GITHUB_RUN_ATTEMPT"]
          repo = os.environ["GITHUB_REPOSITORY"]
          tag = f"backtest-v0.{run_number}.{run_attempt}"
          chart_files = sorted(Path("artifacts/charts").glob("*.png"))
          market_files = sorted(Path("artifacts").glob("*_1h.csv"))

          lines = [
              f"# Backtest #{run_number} (attempt {run_attempt})",
              "",
              f"- Commit: `{sha}`",
          ]
          if metadata:
              lines.extend(
                  [
                      f"- Market: `{metadata['market']}`",
                      f"- Interval: `{metadata['interval']}`",
                      f"- Period: `{metadata['first_candle_open']}` to "
                      f"`{metadata['last_candle_close']}`",
                      f"- Bars: `{metadata['bars']}`",
                      "- Default signal: `completed 1D EMA20 rising 3 days + "
                      "1H EMA20 + 20-bar close breakout`",
                      "- Market data source: `Hyperliquid candleSnapshot API`",
                  ]
              )
          else:
              lines.append("- Dataset: `deterministic regression fixture`")

          lines.extend(
              [
                  "",
                  f"- Initial equity: `{summary['initial_cash']:.4f}`",
                  f"- Final equity: `{summary['final_equity']:.4f}`",
                  f"- Total return: `{summary['total_return_pct']:.6f}%`",
                  f"- Max drawdown: `{summary['max_drawdown_pct']:.6f}%`",
                  f"- Sharpe: `{summary['sharpe']:.6f}`",
                  f"- Trades: `{summary['trades']}`",
                  f"- Win rate: `{summary['win_rate_pct']:.6f}%`",
                  f"- Profit factor: `{summary['profit_factor']:.6f}`",
                  f"- Average R: `{summary['average_r']:.6f}`",
                  "",
              ]
          )

          validation_md = Path("artifacts/v11_validation.md")
          if validation_md.exists():
              lines.extend(
                  [
                      "## v1.1 cross-market validation",
                      "",
                      validation_md.read_text(encoding="utf-8").strip(),
                      "",
                  ]
              )

          lines.extend(
              [
                  "## Trade history charts",
                  "",
                  "Charts use 1D candles. Only the maximum-net-PnL trade and "
                  "minimum-net-PnL trade are marked; all other trades are hidden.",
                  "",
              ]
          )

          for index, chart in enumerate(chart_files, start=1):
              asset_url = (
                  f"https://github.com/{repo}/releases/download/{tag}/{chart.name}"
              )
              lines.extend(
                  [
                      f"### Chart {index}",
                      "",
                      f"![Trade history chart {index}]({asset_url})",
                      "",
                  ]
              )

          lines.extend(
              [
                  "## Attached files",
                  "",
                  "- `summary.json`",
                  "- `equity_curve.csv`",
                  "- `trades.csv`",
                  "- `events.csv`",
                  f"- `{len(chart_files)} main trade-history PNG chart(s)`",
              ]
          )
          if metadata:
              lines.append("- `market_metadata.json`")
          for market_file in market_files:
              lines.append(f"- `{market_file.name}`")
          if os.environ.get("V11") == "true":
              lines.extend(
                  [
                      "- `v11_validation.json`",
                      "- HYPE/XAU full summary and rolling-OOS files",
                      "- HYPE/XAU 1D max-profit/max-loss charts",
                  ]
              )

          Path("artifacts/release_notes.md").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Publish backtest release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TITLE_PREFIX: ${{ steps.mode.outputs.release_title }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          TAG="backtest-v0.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          shopt -s nullglob
          CHARTS=(artifacts/charts/*.png)
          MARKET_FILES=(artifacts/*_1h.csv)
          VALIDATION_FILES=()
          for file in             artifacts/v11_validation.json             artifacts/HYPE_summary.json             artifacts/HYPE_walk_forward.json             artifacts/HYPE_walk_forward_folds.csv             artifacts/XAU_summary.json             artifacts/XAU_walk_forward.json             artifacts/XAU_walk_forward_folds.csv             artifacts/HYPE_trade_history_*.png             artifacts/XAU_trade_history_*.png; do
            [[ -e "$file" ]] && VALIDATION_FILES+=("$file")
          done

          ASSETS=(
            artifacts/summary.json
            artifacts/equity_curve.csv
            artifacts/trades.csv
            artifacts/events.csv
            "${CHARTS[@]}"
            "${MARKET_FILES[@]}"
            "${VALIDATION_FILES[@]}"
          )

          if [[ -f artifacts/market_metadata.json ]]; then
            ASSETS+=(artifacts/market_metadata.json)
          fi

          git tag "${TAG}" "${GITHUB_SHA}"
          git push origin "refs/tags/${TAG}"

          gh release create "${TAG}" \
            "${ASSETS[@]}" \
            --verify-tag \
            --title "${RELEASE_TITLE_PREFIX} #${GITHUB_RUN_NUMBER} · ${SHORT_SHA}" \
            --notes-file artifacts/release_notes.md \
            --latest

      - name: Upload backtest artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-${{ github.sha }}
          path: artifacts/
          retention-days: 30
