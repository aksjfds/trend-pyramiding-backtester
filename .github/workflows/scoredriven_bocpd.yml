name: Score-Driven BOCPD

on:
  push:
    branches:
      - feature/scoredriven-bocpd
    paths:
      - "experiments/scoredriven_bocpd/**"
      - ".github/workflows/scoredriven_bocpd.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/scoredriven_bocpd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: experiments/scoredriven_bocpd/pyproject.toml
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Test
        run: pytest
      - name: Demo smoke test
        run: python examples/demo.py

      - name: Real BTCUSDT 2024 test
        run: python examples/real_btc_2024.py
      - name: Upload real-data result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btcusdt-2024-bocpd-result
          path: experiments/scoredriven_bocpd/btc_2024_result.json
          if-no-files-found: ignore
