[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "trend-pyramiding-backtester"
version = "0.1.0"
description = "Backtester for anti-martingale pyramiding with structure/ATR stops and trailing exits"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
pyramid-backtest = "trend_pyramiding.cli:main"
pyramid-okx = "trend_pyramiding.okx_cli:main"
pyramid-web = "trend_pyramiding.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trend_pyramiding = ["panel.html", "panel.css", "panel.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
